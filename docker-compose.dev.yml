services:
  api:
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
      - ./prisma:/app/prisma
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts && npm run dev -w @ice/api"

  worker:
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./apps/worker/src:/app/apps/worker/src
      - ./packages:/app/packages
    command: npm run dev -w @ice/worker

  web:
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    command: npm run dev -w @ice/web
