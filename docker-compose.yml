services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ice
      POSTGRES_PASSWORD: ice_secret
      POSTGRES_DB: ice_verification
    ports:
      # Use 5433 to avoid clashing with a local Homebrew/Postgres install on 5432.
      - '5433:5432'
    volumes:
      - ice_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ice -d ice_verification']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ice:ice_secret@postgres:5432/ice_verification?schema=public
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
      API_PORT: 4000
      CORS_ORIGINS: http://localhost:3000
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/v1/health/live']
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ice:ice_secret@postgres:5432/ice_verification?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_DEMO_API_KEY: ice_test_demo_key_do_not_use_in_production
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  ice_pg_data:
